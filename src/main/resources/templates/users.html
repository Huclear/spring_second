<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Users list</title>
</head>
<body>
<h1>Users list</h1>
<form action="/users/add" method="post">
    <input type="text" name="login" placeholder="Логин" required>
    <input type="text" name="nickname" placeholder="Псевдоним" required>
    <input type="text" name="aboutMe" placeholder="О себе" required>
    <input type="text" name="password" placeholder="Пароль" required>
    <button type="submit">Add user</button>
</form>

<h2>Users:</h2>
<form action="/users" method="get">
    <label>
        Nickname:
        <input type="text" name="nickname" th:value="${nickname}">
    </label>
    <br>
    <label>
        Min recipes count:
        <input type="number" name="minRecipesCount" th:value="${minRecipesCount}">
    </label>
    <label>
        Max recipes count:
        <input type="number" name="maxRecipesCount" th:value="${maxRecipesCount}">
    </label>
    <label>
        Show deleted:
        <input type="checkbox" name="show_deleted" value="true">
    </label>
    <br>
    <label>
        Page:
        <input type="number" name="page" th:value="${users.currentPage}">
    </label>
    <label>
        Page size:
        <input type="number" name="perPage" th:value="${users.pageSize}" min="10">
    </label>

    <button type="submit">Search</button>
</form>

<br>
<br>
<ul>
    <th:block th:each="user : ${users.value}">
        <li>
            <span th:text="'Login: ' + ${user.login} + ' ' + ' Nickname: ' +${user.nickname} + ' ' + ' About me: ' + ${user.aboutMe} + ' ' + ' Password: ' + ${user.password} + ' ' + ' Salt: ' + ${user.salt}"></span>
            <form action="/users/update" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${user.id}"/>
                <input type="text" name="login" placeholder="Логин" required>
                <input type="text" name="nickname" placeholder="Псевдоним" required>
                <input type="text" name="aboutMe" placeholder="О себе" required>
                <input type="text" name="password" placeholder="Пароль" required>
                <button type="submit">Обновить</button>
            </form>
            <form action="/users/delete" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${user.id}"/>
                <button type="submit">Удалить</button>
            </form>
        </li>
    </th:block>
</ul>
</body>
</html>
